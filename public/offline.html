<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f3ec;
        --canvas: #ffffff;
        --ink: #111827;
        --muted: #64748b;
        --navy: #14386f;
        --on-navy: #e3ecf8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0b1220;
          --canvas: #121a2b;
          --ink: #e5e7eb;
          --muted: #94a3b8;
          --navy: #3b6fd3;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border-radius: 24px;
        background: var(--canvas);
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--navy);
        display: grid;
        place-items: center;
      }
      .logo svg { width: 30px; height: 30px; }
      h1 { margin: 0; font-size: 22px; line-height: 1.2; }
      p { margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--navy);
        color: var(--on-navy);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e3ecf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
          <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244" />
          <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No se pudo cargar la tienda. Revisa tu conexión a internet y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
