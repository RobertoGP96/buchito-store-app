<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f1ea;
        --canvas: #ffffff;
        --ink: #1f1711;
        --muted: #6b625a;
        --brand: #6b3f24;
        --on-brand: #f1e8de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #16100c;
          --canvas: #1f1711;
          --ink: #f1e8de;
          --muted: #a89d92;
          --brand: #6b3f24;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border-radius: 24px;
        background: var(--canvas);
        box-shadow: 0 10px 30px rgba(42, 26, 15, 0.1);
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--brand);
        display: grid;
        place-items: center;
      }
      .logo img { width: 40px; height: 40px; display: block; }
      h1 { margin: 0; font-size: 22px; line-height: 1.2; }
      p { margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
